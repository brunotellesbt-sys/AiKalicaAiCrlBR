name: Validate Windows ROM tools
on:
  pull_request:
    paths: ['tools/**', '.github/workflows/windows-tools.yml']
  push:
    branches: [fix/legacy-wine]
    paths: ['tools/**', '.github/workflows/windows-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tools:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate portable runtime and real GUI launchers
        shell: pwsh
        run: ./tools/windows/validate.ps1
      - name: Preserve screenshots and validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-tools-validation
          path: .local/windows-report/
          if-no-files-found: error
