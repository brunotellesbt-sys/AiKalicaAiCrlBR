name: Validate Surf routes
on:
  pull_request:
    paths: ['roms/**', 'mods/sea-routes/**', 'mods/hoenn/**', 'tools/sea_routes/**', 'tools/hoenn/**', 'tools/ci/**', 'web/**', '.github/workflows/sea-routes.yml']
  push:
    branches: [main]
    paths: ['roms/**', 'mods/sea-routes/**', 'mods/hoenn/**', 'tools/sea_routes/**', 'tools/hoenn/**', 'tools/ci/**', 'web/**', '.github/workflows/sea-routes.yml']
permissions:
  contents: read
jobs:
  sea-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch immutable evidence baseline
        # A shallow PR checkout does not contain the pinned historical media.
        # Fetch its one commit so the tests can verify the original bytes.
        run: git fetch --no-tags --depth=1 origin 4f7e33cd49004cde4dfb668d76deb95803981cf9
      - name: Install indexed sprite validation dependency
        run: python3 -m pip install Pillow==11.3.0
      - name: Verify catalog, water elevations, NPCs and connections
        run: |
          python3 -m unittest discover -s tools/sea_routes -v
          python3 -m unittest discover -s tools/hoenn -v
          python3 tools/hoenn/verify_playable.py
          python3 tools/hoenn/verify_versions.py
      - name: Configure Ubuntu package downloads
        run: |
          python3 -m unittest discover -s tools/ci -v
          sudo python3 tools/ci/configure_ubuntu_apt.py
      - name: Install browser validation runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-validation" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/browser-validation/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test current ROMs in browser and stage player
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-validation/node_modules/playwright
        run: |
          python3 tools/hoenn/run_versions_browser.py
          python3 tools/hoenn/stage_pages.py --output /tmp/player-site
      - name: Upload current browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-rom-browser-validation
          path: mods/hoenn/versions-validation/browser/
      - name: Install mGBA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmgba-dev
      - name: Exercise physical Surf transitions
        run: |
          gcc -shared -fPIC -O2 tools/rom_hacks/mgba_bridge.c -o /tmp/mgba-bridge.so -lmgba
          python3 tools/sea_routes/validate_emulator.py --library /tmp/mgba-bridge.so
          python3 -m unittest discover -s tools/sea_routes -v
