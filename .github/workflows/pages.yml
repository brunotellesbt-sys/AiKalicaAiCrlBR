name: Publish browser player
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'docs/**', 'roms/**', 'mods/hoenn/playable/**', 'mods/hoenn/versions/**', 'tools/hoenn/stage_pages.py', 'tools/hoenn/verify_versions.py', 'tools/hoenn/run_versions_browser.py', 'tools/hoenn/validate_versions_browser.cjs', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install browser validation runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-validation" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/browser-validation/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test current ROMs in browser
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-validation/node_modules/playwright
        run: python3 tools/hoenn/run_versions_browser.py
      - name: Stage static player and current ROM
        run: python3 tools/hoenn/stage_pages.py --output /tmp/player-site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: /tmp/player-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify five published editions
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-validation/node_modules/playwright
          PLAYABLE_SITE_URL: ${{ steps.deployment.outputs.page_url }}
          BROWSER_VALIDATION_OUTPUT: ${{ runner.temp }}/pages-live-validation
        run: node tools/hoenn/validate_versions_browser.cjs
      - name: Upload published player evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-player-validation
          path: ${{ runner.temp }}/pages-live-validation/
